<text x="1280.0" y="498" text-anchor="middle" font-size="11" font-style="italic" fill="#fff">[prom/prometheus]</text>
<text x="1280.0" y="514" text-anchor="middle" font-size="11" fill="#fff">Хранит метрики, скрейпит backend</text>
<rect x="1110" y="650" width="340" height="100" rx="6" fill="#438dd5" stroke="#3c7fc0" stroke-width="1.5"/>
