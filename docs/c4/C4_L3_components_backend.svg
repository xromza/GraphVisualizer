<text x="550.0" y="680" text-anchor="middle" font-size="14" font-weight="bold" fill="#08233f">GlobalErrorHandler</text>
<text x="550.0" y="698" text-anchor="middle" font-size="11" font-style="italic" fill="#08233f">[@RestControllerAdvice]</text>
<text x="550.0" y="714" text-anchor="middle" font-size="11" fill="#08233f">IllegalStateException → 400</text>
<text x="550.0" y="728" text-anchor="middle" font-size="11" fill="#08233f">(ErrorResponse)</text>
