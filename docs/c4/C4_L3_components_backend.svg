<text x="550.0" y="498" text-anchor="middle" font-size="11" font-style="italic" fill="#08233f">[@Service]</text>
<text x="550.0" y="514" text-anchor="middle" font-size="11" fill="#08233f">Маршрут из участков, нумерация</text>
<text x="550.0" y="528" text-anchor="middle" font-size="11" fill="#08233f">шагов, отправка в приёмник</text>
<rect x="780" y="450" width="220" height="100" rx="6" fill="#85bbf0" stroke="#5d9dd5" stroke-width="1.5"/>
<text x="890.0" y="480" text-anchor="middle" font-size="14" font-weight="bold" fill="#08233f">AlgorithmRegistry</text>
<text x="890.0" y="498" text-anchor="middle" font-size="11" font-style="italic" fill="#08233f">[@Service]</text>
<text x="890.0" y="514" text-anchor="middle" font-size="11" fill="#08233f">Алгоритм по идентификатору,</text>
