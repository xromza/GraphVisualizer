<text x="550.0" y="90" text-anchor="middle" font-size="14" font-weight="bold" fill="#fff">Redis</text>
<text x="550.0" y="108" text-anchor="middle" font-size="11" font-style="italic" fill="#fff">[redis]</text>
<text x="550.0" y="124" text-anchor="middle" font-size="11" fill="#fff">Счётчики лимита запросов</text>
