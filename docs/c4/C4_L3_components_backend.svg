<text x="190.0" y="280" text-anchor="middle" font-size="14" font-weight="bold" fill="#08233f">RateLimitingFilter</text>
<text x="190.0" y="298" text-anchor="middle" font-size="11" font-style="italic" fill="#08233f">[WebFilter, Bucket4j]</text>
<text x="190.0" y="314" text-anchor="middle" font-size="11" fill="#08233f">Лимит 50 запросов/мин по IP;</text>
<text x="190.0" y="328" text-anchor="middle" font-size="11" fill="#08233f">при превышении — 429</text>
<rect x="420" y="250" width="260" height="100" rx="6" fill="#85bbf0" stroke="#5d9dd5" stroke-width="1.5"/>
<text x="550.0" y="280" text-anchor="middle" font-size="14" font-weight="bold" fill="#08233f">StreamController</text>
<text x="550.0" y="298" text-anchor="middle" font-size="11" font-style="italic" fill="#08233f">[@RestController]</text>
<text x="550.0" y="314" text-anchor="middle" font-size="11" fill="#08233f">POST /api/v1/algorithm/run (SSE),</text>
<text x="550.0" y="328" text-anchor="middle" font-size="11" fill="#08233f">GET /api/v1/algorithm/all</text>
